      <text x="25" y="27" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#A1A1AA">TEAM MEMBER</text>
      <text x="280" y="27" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#A1A1AA">DEPARTMENT</text>
      <text x="480" y="27" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#A1A1AA">ROLE</text>
      <text x="680" y="27" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#A1A1AA">STATUS</text>
      <text x="850" y="27" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#A1A1AA">QUICK ACTION</text>

      <!-- Row 1 -->
      <g transform="translate(0, 44)">
        <circle cx="40" cy="30" r="14" fill="#E60000"/>
        <text x="40" y="34" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">SR</text>
        <text x="68" y="26" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Shijin Riju</text>
        <text x="68" y="42" font-family="'Space Mono', monospace" font-size="10" fill="#71717A">EMP-2024-042</text>
        
        <rect x="280" y="16" width="95" height="24" rx="4" fill="#27272A"/>
        <text x="294" y="32" font-family="'Manrope', sans-serif" font-size="11" fill="#E4E4E7">Engineering</text>
        
        <text x="480" y="33" font-family="'Manrope', sans-serif" font-size="12" fill="#D4D4D8">AI &amp; Full Stack Lead</text>
        
        <rect x="680" y="16" width="75" height="24" rx="12" fill="#14532D"/>
        <text x="695" y="32" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#4ADE80">● Active</text>
        
        <text x="850" y="33" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" fill="#EF4444">Inspect →</text>
        <line x1="0" y1="58" x2="960" y2="58" stroke="#27272A" stroke-width="1"/>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 102)">
        <circle cx="40" cy="30" r="14" fill="#27272A"/>
        <text x="40" y="34" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">AM</text>
        <text x="68" y="26" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Ananya Menon</text>
        <text x="68" y="42" font-family="'Space Mono', monospace" font-size="10" fill="#71717A">EMP-2024-031</text>
        
        <rect x="280" y="16" width="75" height="24" rx="4" fill="#27272A"/>
        <text x="294" y="32" font-family="'Manrope', sans-serif" font-size="11" fill="#E4E4E7">Product</text>
        
        <text x="480" y="33" font-family="'Manrope', sans-serif" font-size="12" fill="#D4D4D8">UI/UX Designer</text>
        
        <rect x="680" y="16" width="75" height="24" rx="12" fill="#14532D"/>
        <text x="695" y="32" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#4ADE80">● Active</text>
        
        <text x="850" y="33" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" fill="#EF4444">Inspect →</text>
        <line x1="0" y1="58" x2="960" y2="58" stroke="#27272A" stroke-width="1"/>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 160)">
        <circle cx="40" cy="30" r="14" fill="#3F3F46"/>
        <text x="40" y="34" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">RK</text>
        <text x="68" y="26" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Rahul Kaimal</text>
        <text x="68" y="42" font-family="'Space Mono', monospace" font-size="10" fill="#71717A">EMP-2023-018</text>
        
        <rect x="280" y="16" width="85" height="24" rx="4" fill="#27272A"/>
        <text x="294" y="32" font-family="'Manrope', sans-serif" font-size="11" fill="#E4E4E7">Operations</text>
        
        <text x="480" y="33" font-family="'Manrope', sans-serif" font-size="12" fill="#D4D4D8">Backend Systems</text>
        
        <rect x="680" y="16" width="85" height="24" rx="12" fill="#78350F"/>
        <text x="695" y="32" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#FCD34D">● On Leave</text>
        
        <text x="850" y="33" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" fill="#EF4444">Inspect →</text>
      </g>
    </g>
  </g>
</svg>
